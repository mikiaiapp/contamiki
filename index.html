<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/contamiki.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>ContaMiki | Finanzas Inteligentes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #020617; margin: 0; padding: 0; }
      #app-loader { transition: opacity 0.5s ease; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: white; z-index: 9999; }
      .loader-spin { width: 64px; height: 64px; border: 4px solid rgba(99, 102, 241, 0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 2rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .tracking-widest-plus { letter-spacing: 0.4em; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.4); }
    </style>
</head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>

    <div id="app-loader">
        <div class="loader-spin"></div>
        <h1 class="text-2xl font-black tracking-tighter mb-2">ContaMiki</h1>
        <p id="loader-status" class="text-[10px] font-black uppercase tracking-widest-plus text-slate-500 animate-pulse">Iniciando motor financiero...</p>
    </div>

    <script>
      window.addEventListener('error', function(e) {
        const status = document.getElementById('loader-status');
        if (status) {
          status.innerHTML = '<span style="color: #ef4444;">Error de carga: ' + (e.message || 'Desconocido') + '</span>';
          status.classList.remove('animate-pulse');
        }
      });
      // Timeout fallback
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader && loader.style.opacity !== '0') {
           const status = document.getElementById('loader-status');
           if(status && !status.innerHTML.includes('Error')) {
             status.innerHTML = '<span style="color: #f59e0b;">Tardando más de lo esperado... <br/> Revisa la consola.</span>';
           }
        }
      }, 10000);
    </script>

    <!-- En desarrollo usamos index.tsx, en producción server.js lo cambiará por bundle.js -->
    <script type="module" src="index.tsx" onerror="console.error('Error loading index.tsx'); document.getElementById('loader-status').innerHTML = '<span style=\'color:red\'>Error cargando script principal.</span>'"></script>
  </body>
</html>
